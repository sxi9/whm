<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sample Notes widget</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; color: #1f2937; }
    .card { border: 1px solid #d1d5db; border-radius: 6px; padding: 12px 16px; max-width: 480px; }
    code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; }
  </style>

<body>
  <div class="card">
    <h2>Sample Notes</h2>

      <code>form</code> page for anything that needs data.</p>
  </div>
</body>
</html>
